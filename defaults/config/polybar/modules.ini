[module/divider]
type = custom/text
label = |
label-foreground = ${color.muted}
label-padding = 16px

[module/date]
type = internal/date
interval = 1
time = %I:%M %p
label = "%{T2}󰅐%{T-} %time%"

[module/network]
type = custom/script
exec = bash "${env:XDG_CONFIG_HOME}/polybar/scripts/status.sh" ip
interval = 15
label = %output%
click-left = bash "${env:XDG_CONFIG_HOME}/polybar/scripts/status.sh" copy-ip

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
reverse-scroll = true
format = <label-state>
format-font = 3
label-focused = %{T3}%{T-}
label-focused-foreground = ${color.red}
label-focused-padding = 5px
label-occupied = %{T3}%{T-}
label-occupied-foreground = ${color.red}
label-occupied-padding = 5px
label-empty = %{T3}%{T-}
label-empty-foreground = ${color.muted}
label-empty-padding = 5px
label-urgent = %{T3}%{T-}
label-urgent-foreground = ${color.red}
label-urgent-padding = 5px

[module/target]
type = custom/script
exec = bash "${env:XDG_CONFIG_HOME}/polybar/scripts/status.sh" target
interval = 1
label = "%{F#FF6266}%{T4}󰓾%{T-}%{F-} %output%"
click-left = bash "${env:XDG_CONFIG_HOME}/polybar/scripts/target.sh" click
click-right = bash "${env:XDG_CONFIG_HOME}/polybar/scripts/target.sh" edit

[module/pulseaudio]
type = custom/script
exec = bash "${env:XDG_CONFIG_HOME}/polybar/scripts/volume.sh" status
interval = 5
label = %output%
click-left = bash "${env:XDG_CONFIG_HOME}/polybar/scripts/volume.sh" slider
click-right = pavucontrol
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +2%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -2%

[module/battery]
type = custom/script
exec = python3 "${env:XDG_CONFIG_HOME}/polybar/scripts/battery.py"
interval = 30
label = %output%
label-padding-left = 16px

[module/power]
type = custom/text
label = 󰐥
label-font = 2
click-left = bash "${env:XDG_CONFIG_HOME}/polybar/scripts/power.sh"

[module/applications]
type = custom/text
label = Svent
label-foreground = ${color.red}
click-left = /usr/libexec/svent/bspwm/tools-menu.py
click-right = rofi -show drun
