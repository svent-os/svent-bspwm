backend = "xrender";
vsync = true;
use-damage = true;
shadow = true;
shadow-radius = 12;
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-opacity = 0.25;
shadow-color = "#000000";
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;
corner-radius = 3;
detect-client-opacity = true;
detect-transient = true;
shadow-exclude = [ "class_g = 'Polybar'", "class_g = 'Dunst'", "class_g = 'Rofi'" ];
rounded-corners-exclude = [ "window_type = 'dock'", "class_g = 'Dunst'", "class_g = 'Rofi'", "fullscreen" ];
