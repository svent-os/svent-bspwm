[global/wm]
margin-bottom = 0
margin-top = 0
include-file = modules.ini

[color]
bg = #E6191D22
fg = #E6E7E8
red = #FF6266
muted = #7E8995

[bar/z1rov-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
bottom = false
fixed-center = true
width = 98.4%
height = 34px
offset-x = 0.8%
offset-y = 8px
radius = 8
background = ${color.bg}
foreground = ${color.fg}
line-size = 0
border-size = 0px
border-color = #30353B
padding-left = 14px
padding-right = 14px
module-margin = 0
font-0 = JetBrains Mono:style=Regular:pixelsize=11;3
font-1 = Material Design Icons Desktop:pixelsize=13;3
font-2 = Z1rov Workspace Balanced:pixelsize=10;3
font-3 = Material Design Icons Desktop:pixelsize=11;3
modules-left = date divider network
modules-center = bspwm
modules-right = ${env:SVENT_RIGHT:target divider pulseaudio battery divider power}
separator =
wm-restack = bspwm
override-redirect = false
enable-ipc = true
cursor-click = pointer

[settings]
screenchange-reload = true
pseudo-transparency = false
